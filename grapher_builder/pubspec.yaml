name: grapher_builder
description: GraphQL code generation based on dart code models. Supports all GraphQL types including queries, mutations, subscriptions, inputs, and enums.
version: 0.2.4

resolution: workspace

repository: https://github.com/iadept/grapher/

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  analyzer: ">=7.3.0 <9.0.0"
  collection: ^1.0.0
  gql: ^1.0.0
  grapher_annotation: ^0.2.0
  source_gen: ^4.0.0
  build: ^4.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  # build_runner 2.9.0 has a breaking change(i don't know how to fix it) that affects debugging this package
  build_runner: <2.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
